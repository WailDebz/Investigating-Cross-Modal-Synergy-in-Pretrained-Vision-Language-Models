[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synergy-bench"
version = "0.1.0"
description = "Controlled synthetic benchmark for cross-modal synergy in pretrained vision-language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "torch>=2.2",
    "transformers>=4.46,<5",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
legacy = ["scikit-learn>=1.4", "matplotlib>=3.8", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
